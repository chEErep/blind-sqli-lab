{% extends "base.html" %}
{% block title %}Регистрация - ПодСлушано{% endblock %}
{% block content %}
<style>
  .center{min-height:calc(100vh - 64px);display:flex;align-items:center;justify-content:center;padding:40px 22px}
  .auth-card{width:100%;max-width:400px;padding:30px}
</style>
<div class="center">
  <div class="card auth-card">
    <h2>Регистрация</h2>
    <p class="muted" style="font-size:13px;margin-top:6px">Создай аккаунт, чтобы слушать музыку.</p>
    <form method="post" action="/register">
      <label>Логин</label>
      <input name="username" autocomplete="username" placeholder="твой логин">
      <label>Email</label>
      <input name="email" type="email" placeholder="you@mail.com">
      <label>Пароль</label>
      <input name="password" type="password" autocomplete="new-password" placeholder="••••••••">
      <button class="btn full" type="submit" style="margin-top:20px">Создать аккаунт</button>
    </form>
    <p style="margin-top:16px;font-size:13px"><a href="/">Уже есть аккаунт? Войти</a></p>
  </div>
</div>
{% endblock %}
